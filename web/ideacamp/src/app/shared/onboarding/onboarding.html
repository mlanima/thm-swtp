<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4">
  <section class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs font-bold uppercase tracking-wide text-lime-600">
          {{ 'ONBOARDING.LABEL' | translate }}
        </p>

        <h2 class="mt-2 text-2xl font-bold text-slate-800">
          {{ 'ONBOARDING.TITLE' | translate }}
        </h2>
      </div>

      <button
        type="button"
        class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
        (click)="remindLaterClicked()"
        [attr.aria-label]="'ONBOARDING.REMIND_LATER' | translate"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    @if (steps[currentStep()]; as step) {
      <div class="mt-8 rounded-xl border border-slate-200 bg-slate-50 p-5">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-lime-100 text-lime-700">
          <i [class]="step.icon"></i>
        </div>

        <h3 class="text-lg font-bold text-slate-800">
          {{ step.titleKey | translate }}
        </h3>

        <p class="mt-2 text-sm leading-6 text-slate-600">
          {{ step.textKey | translate }}
        </p>
      </div>
    }

    <div class="mt-5 flex items-center justify-center gap-2">
      @for (step of steps; track step.titleKey; let index = $index) {
        <span
          class="h-2 rounded-full transition-all"
          [class.w-6]="index === currentStep()"
          [class.w-2]="index !== currentStep()"
          [class.bg-lime-500]="index === currentStep()"
          [class.bg-slate-200]="index !== currentStep()"
        ></span>
      }
    </div>

    <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
      <button
        type="button"
        class="text-sm font-medium text-slate-500 transition hover:text-slate-700"
        (click)="remindLaterClicked()"
      >
        {{ 'ONBOARDING.REMIND_LATER' | translate }}
      </button>

      <div class="flex gap-3">
        <button
          type="button"
          class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 disabled:opacity-40"
          [disabled]="isFirstStep"
          (click)="previous()"
        >
          {{ 'ONBOARDING.BACK' | translate }}
        </button>

        <button
          type="button"
          class="rounded-lg bg-lime-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-lime-600"
          (click)="next()"
        >
          {{ isLastStep ? ('ONBOARDING.FINISH' | translate) : ('ONBOARDING.NEXT' | translate) }}
        </button>
      </div>
    </div>
  </section>
</div>
