@if (isLoading()) {
  <div
    class="mt-6 rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center shadow-sm"
  >
    <p class="text-sm text-slate-500">{{ 'MYTHESES.LOADING' | translate }}</p>
  </div>
} @else if (errorMessage()) {
  <div
    class="mt-6 rounded-2xl border border-red-200 bg-red-50 px-6 py-12 text-center shadow-sm"
  >
    <p class="text-sm font-medium text-red-700">{{ errorMessage() }}</p>
  </div>
} @else if (theses().length === 0) {
  <div
    class="mt-6 rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center shadow-sm"
  >
    <div
      class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-slate-100 text-slate-500"
    >
      <i class="pi pi-graduation-cap text-2xl"></i>
    </div>
    <h3 class="mt-5 text-2xl font-semibold text-slate-700">{{ 'MYTHESES.EMPTY_TITLE' | translate }}</h3>
    <p class="mt-2 text-sm text-slate-500">
      {{ 'MYTHESES.EMPTY_DESCRIPTION' | translate }}
    </p>
  </div>
} @else {
  <div class="mt-4 flex flex-col gap-3">
    @for (thesis of theses(); track thesis.id) {
      <app-thesis-card [thesis]="thesis" [animationDelay]="$index * 50" />
    }
  </div>
}
