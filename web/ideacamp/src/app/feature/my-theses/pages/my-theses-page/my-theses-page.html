<section class="min-h-screen bg-slate-100 px-6 py-8 text-slate-700">
  <div class="mx-auto max-w-6xl">
    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <h1 class="text-4xl font-bold text-slate-700">{{ 'MYTHESES.TITLE' | translate }}</h1>
      <div class="flex gap-2">
        @if (isProfessor()) {
          <a
            routerLink="/createThesis"
            class="inline-flex items-center justify-center rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-900"
          >
            {{ 'MYTHESES.CREATE_THESIS' | translate }}
          </a>
        }
      </div>
    </header>

    <div class="mt-8">
      <h2 class="text-2xl font-bold text-slate-700">{{ 'MYTHESES.THESES' | translate }}</h2>
      <p class="text-sm text-slate-400">
        {{ theses().length }} {{ 'MYTHESES.THESES_COUNT_LABEL' | translate }}
      </p>

      <app-thesis-list
        [theses]="theses()"
        [isLoading]="isLoading()"
        [errorMessage]="errorMessage()"
      />
    </div>
  </div>
</section>
