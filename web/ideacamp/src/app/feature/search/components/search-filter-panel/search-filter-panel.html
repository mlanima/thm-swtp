<div class="mt-4 space-y-5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">

  @if (mode() === 'projects') {
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium text-slate-700">{{ 'SEARCH.FILTERS.HAS_OPEN_POSITIONS' | translate }}</span>
      <button
        type="button"
        (click)="toggleHasOpenPositions()"
        class="flex h-6 w-12 items-center rounded-full p-1 transition"
        [class.bg-lime-500]="projectFilters.hasOpenPositions"
        [class.bg-slate-300]="!projectFilters.hasOpenPositions"
      >
        <span class="h-4 w-4 rounded-full bg-white transition" [class.translate-x-6]="projectFilters.hasOpenPositions"></span>
      </button>
    </div>

    <div class="flex items-center justify-between">
      <span class="text-sm font-medium text-slate-700">{{ 'SEARCH.FILTERS.ALLOW_JOIN_REQUESTS' | translate }}</span>
      <button
        type="button"
        (click)="toggleAllowJoinRequests()"
        class="flex h-6 w-12 items-center rounded-full p-1 transition"
        [class.bg-lime-500]="projectFilters.allowJoinRequests"
        [class.bg-slate-300]="!projectFilters.allowJoinRequests"
      >
        <span class="h-4 w-4 rounded-full bg-white transition" [class.translate-x-6]="projectFilters.allowJoinRequests"></span>
      </button>
    </div>
  } @else {
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium text-slate-700">{{ 'SEARCH.FILTERS.IS_PROFESSOR' | translate }}</span>
      <button
        type="button"
        (click)="toggleIsProfessor()"
        class="flex h-6 w-12 items-center rounded-full p-1 transition"
        [class.bg-lime-500]="userFilters.isProfessor"
        [class.bg-slate-300]="!userFilters.isProfessor"
      >
        <span class="h-4 w-4 rounded-full bg-white transition" [class.translate-x-6]="userFilters.isProfessor"></span>
      </button>
    </div>

    <div>
      <label for="filter-location" class="mb-1 block text-sm font-medium text-slate-700">{{ 'SEARCH.FILTERS.LOCATION' | translate }}</label>
      <input
        id="filter-location"
        type="text"
        [value]="userFilters.location ?? ''"
        (input)="setLocation($any($event.target).value)"
        [placeholder]="'SEARCH.FILTERS.LOCATION_PLACEHOLDER' | translate"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-lime-500"
      />
    </div>
  }

  <div>
    <span class="mb-1 block text-sm font-medium text-slate-700">{{ 'SEARCH.FILTERS.DATE_RANGE.LABEL' | translate }}</span>
    <div class="inline-flex flex-wrap rounded-xl bg-slate-100 p-1 shadow-sm">
      <button
        type="button"
        class="rounded-lg px-4 py-1.5 text-sm font-medium transition"
        [class.bg-white]="activeDateRangePreset() === 'any'"
        [class.text-slate-800]="activeDateRangePreset() === 'any'"
        [class.shadow-sm]="activeDateRangePreset() === 'any'"
        [class.text-slate-500]="activeDateRangePreset() !== 'any'"
        (click)="setDateRangePreset('any')"
      >
        {{ 'SEARCH.FILTERS.DATE_RANGE.ANY_TIME' | translate }}
      </button>
      <button
        type="button"
        class="rounded-lg px-4 py-1.5 text-sm font-medium transition"
        [class.bg-white]="activeDateRangePreset() === '7d'"
        [class.text-slate-800]="activeDateRangePreset() === '7d'"
        [class.shadow-sm]="activeDateRangePreset() === '7d'"
        [class.text-slate-500]="activeDateRangePreset() !== '7d'"
        (click)="setDateRangePreset('7d')"
      >
        {{ 'SEARCH.FILTERS.DATE_RANGE.LAST_7_DAYS' | translate }}
      </button>
      <button
        type="button"
        class="rounded-lg px-4 py-1.5 text-sm font-medium transition"
        [class.bg-white]="activeDateRangePreset() === '30d'"
        [class.text-slate-800]="activeDateRangePreset() === '30d'"
        [class.shadow-sm]="activeDateRangePreset() === '30d'"
        [class.text-slate-500]="activeDateRangePreset() !== '30d'"
        (click)="setDateRangePreset('30d')"
      >
        {{ 'SEARCH.FILTERS.DATE_RANGE.LAST_30_DAYS' | translate }}
      </button>
      <button
        type="button"
        class="rounded-lg px-4 py-1.5 text-sm font-medium transition"
        [class.bg-white]="activeDateRangePreset() === '1y'"
        [class.text-slate-800]="activeDateRangePreset() === '1y'"
        [class.shadow-sm]="activeDateRangePreset() === '1y'"
        [class.text-slate-500]="activeDateRangePreset() !== '1y'"
        (click)="setDateRangePreset('1y')"
      >
        {{ 'SEARCH.FILTERS.DATE_RANGE.LAST_YEAR' | translate }}
      </button>
    </div>
  </div>

</div>
