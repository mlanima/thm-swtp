@if (showOnboarding()) {
  <app-onboarding
    (completed)="completeOnboarding()"
    (remindLater)="closeOnboardingForNow()"
  />
} @else {
  <section class="min-h-screen grid place-items-center bg-slate-50">
    <p class="text-sm text-slate-400">
      {{ 'AUTH.REDIRECTING' | translate }}
    </p>
  </section>
}
