<section class="relative rounded-xl bg-white p-6 shadow-lg">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-xl font-bold text-slate-800">
      {{ title }}
    </h2>
  </div>

  <div class="break-words text-sm leading-6 text-slate-600" [innerHTML]="text | markdown"></div>

  @if (isOwnProfile) {
    <div class="absolute bottom-4 right-4">
      <app-edit-button (click)="edit.emit()"></app-edit-button>
    </div>
  }
</section>
