name: CI Discord Bot

on:
  pull_request:
    paths:
      - 'discord-bot/**'
    branches: [main, developer]

jobs:
  ci-bot:
    name: CI (discord.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
